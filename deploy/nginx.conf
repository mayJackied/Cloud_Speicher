# Cloud Speicher 前端站点。setup-nginx.sh 会把 __BACKEND_UPSTREAM__
# 替换成实际地址（默认 127.0.0.1:8080）。
# 上传走 octet-stream 边收边写，必须关掉请求缓冲、拉长超时。

upstream cloud_speicher_api {
    server __BACKEND_UPSTREAM__;
    keepalive 16;
}

server {
    listen __HTTP_PORT__;
    server_name _;

    charset utf-8;
    server_tokens off;
    root /var/www/cloud-speicher;
    index index.html;

    client_max_body_size 0;
    client_body_timeout 3600s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api {
        proxy_pass http://cloud_speicher_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
